name: Build and Push Container Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  release:
    types: [published]
  schedule:
    - cron: '0 0 * * 0'

env:
  REGISTRY: ghcr.io

jobs:
  detect-dockerfiles:
    name: Detect Dockerfiles
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find all Dockerfiles
        id: find
        run: |
          matrix=$(find . -type f -name "Dockerfile*" -not -path "./.git/*" | sort | \
            jq -Rsc '[
              split("\n")[] | select(length > 0) | . as $f |
              (. | split("/")[-1]) as $name |
              (if $name == "Dockerfile" then "" else "-" + ($name | ltrimstr("Dockerfile.")) end) as $suffix |
              {"dockerfile": $f, "suffix": $suffix}
            ] | {include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and Push (${{ github.repository }}${{ matrix.suffix }})
    needs: detect-dockerfiles
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-dockerfiles.outputs.matrix) }}
    uses: ./.github/workflows/build-image-reusable.yml
    with:
      dockerfile: ${{ matrix.dockerfile }}
      suffix: ${{ matrix.suffix }}
      registry: ghcr.io
    permissions:
      contents: read
      packages: write
